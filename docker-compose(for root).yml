services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: metron-scanner-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: metron-scanner-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped